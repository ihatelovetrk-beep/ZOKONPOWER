<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:linear-gradient(135deg,#f2f2f2,#e6e6e6);
}

.card{
width:100%;
max-width:420px;
background:#fff;
padding:30px 25px;
border-radius:30px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.profile{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
border:5px solid #ff0000;
margin-bottom:20px;
}

.title{
font-size:26px;
font-weight:800;
color:#111;
line-height:1.3;
margin-bottom:25px;
}

.btn{
display:block;
width:100%;
background:#1565c0;
color:#fff;
text-decoration:none;
padding:16px;
border-radius:50px;
font-size:20px;
font-weight:700;
margin:18px 0;
transition:.3s;
}

.btn:hover{
transform:translateY(-2px);
}

.timer-box{
margin:20px 0;
}

.timer{
font-size:34px;
font-weight:800;
color:#ff3b75;
letter-spacing:2px;
}

.labels{
display:flex;
justify-content:space-between;
margin-top:8px;
padding:0 8px;
font-size:12px;
font-weight:700;
color:#ff00ff;
}

.footer{
margin-top:25px;
font-size:16px;
font-weight:700;
}

.footer span{
color:#ff3b75;
}

@media(max-width:480px){

.title{
font-size:22px;
}

.timer{
font-size:28px;
}

.btn{
font-size:18px;
padding:15px;
}

}

<script>

let seconds = 10;

const timer = setInterval(() => {

document.getElementById("countdown").innerHTML =
`00:00:00:${String(seconds).padStart(2,'0')}`;

seconds--;

if(seconds < 0){

clearInterval(timer);

window.location.href =
"https://t.me/+kwSpDKZA8O0xZmJl";

}

},1000);

</script>
