<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#efefef;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    background:#fff;
    width:100%;
    max-width:520px;
    border-radius:35px;
    padding:30px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.profile{
    width:180px;
    height:180px;
    border-radius:50%;
    border:5px solid red;
    object-fit:cover;
}

.title{
    font-size:42px;
    font-weight:900;
    margin:25px 0;
    color:#111;
}

.btn{
    display:block;
    background:#1565c0;
    color:#fff;
    text-decoration:none;
    padding:20px;
    border-radius:50px;
    font-size:22px;
    font-weight:700;
    margin:20px 0;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.03);
}

.timer{
    font-size:52px;
    font-weight:bold;
    color:#ff3366;
    letter-spacing:4px;
    margin-top:20px;
}

.labels{
    display:flex;
    justify-content:space-around;
    margin-top:10px;
    color:#ff00ff;
    font-weight:bold;
}

.footer{
    margin-top:35px;
    font-size:20px;
    font-weight:700;
}

.footer span{
    color:#ff3366;
}

@media(max-width:600px){
    .title{
        font-size:28px;
    }

    .timer{
        font-size:38px;
    }

    .btn{
        font-size:18px;
    }
}
</style>

<body>

<div class="card">

<img class="profile"
src="https://d1yei2z3i6k35z.cloudfront.net/17601983/6a25acde452002.76529979_1436.png">

<h1 class="title">‼️ 𝗔𝗡𝗔𝗦𝗟𝗜𝗬𝗘 𝗭𝗢𝗞𝗢𝗡 ‼️</h1>

<a class="btn"
href="https://t.me/+kwSpDKZA8O0xZmJl"
onclick="fbq('track','Lead');">
✈️ Join Free Telegram
</a>

<div class="timer" id="countdown">00 : 00 : 00 : 10</div>

<div class="labels">
<span>DAYS</span>
<span>HOURS</span>
<span>MINUTES</span>
<span>SECONDS</span>
</div>

<a class="btn"
href="https://t.me/+kwSpDKZA8O0xZmJl"
onclick="fbq('track','Lead');">
✈️ Join Free Telegram
</a>

<div class="footer">
Ads managed by <span>@DxZokon</span>
</div>

</div>

<script>
let seconds = 10;

const timer = setInterval(() => {

    document.getElementById("countdown").innerHTML =
        `00 : 00 : 00 : ${String(seconds).padStart(2,'0')}`;

    seconds--;

    if(seconds < 0){
        clearInterval(timer);

        window.location.href =
        "https://t.me/+kwSpDKZA8O0xZmJl";
    }

},1000);
</script>

</body>
